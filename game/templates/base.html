{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Komi TCG{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'game/tcg.css' %}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{% url 'home' %}">KOMI TCG</a>
    {% if user.is_authenticated %}
    <nav>
      <a href="{% url 'home' %}">Packs</a>
      <a href="{% url 'collection' %}">Collection</a>
      <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="linklike">Log out</button></form>
    </nav>
    {% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
  {% block scripts %}{% endblock %}
</body>
</html>
