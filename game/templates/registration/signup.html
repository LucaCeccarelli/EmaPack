{% extends "base.html" %}
{% block title %}Sign up · Pack Ema{% endblock %}
{% block content %}
<form method="post" class="panel form">{% csrf_token %}
  <span class="brand-mark big">EMA</span>
  <h1>Start your collection</h1>
  <p class="muted">Every club and student of the school, one pack at a time.</p>
  {{ form.as_div }}
  <button class="btn block">Sign up</button>
  <p class="form-foot">Already playing? <a href="{% url 'login' %}">Log in</a></p>
</form>
{% endblock %}
