name: Build & Push Docker Image

# Every merge into main: run the test suite, then publish the image to the
# private registry. The prod stack picks up `:latest` via Watchtower.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-publish
  cancel-in-progress: true

env:
  REGISTRY: registry.irwinladrette.fr
  IMAGE_NAME: emapack

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:17
        env:
          POSTGRES_DB: pack_ema
          POSTGRES_USER: pack_ema
          POSTGRES_PASSWORD: pack_ema
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pack_ema -d pack_ema"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      SECRET_KEY: ci-only-not-secret
      DEBUG: "True"
      POSTGRES_DB: pack_ema
      POSTGRES_USER: pack_ema
      POSTGRES_PASSWORD: pack_ema
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run python manage.py test game

  build-and-push:
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to private registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
